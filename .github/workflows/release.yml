name: release

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".goreleaser.yaml"
      - ".github/workflows/release.yml"
      - "ops/rewrite-cask-postflight.rb"
      - "ops/publish-homebrew-cask.sh"
      - "cmd/remiterm/**"
      - "go.mod"
      - "go.sum"

concurrency:
  group: goreleaser-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test Homebrew cask rewrite
        run: ruby ops/rewrite-cask-postflight.rb --test

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: ${{ startsWith(github.ref, 'refs/tags/v') && 'release --clean' || 'release --snapshot --clean --skip=publish' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Rewrite Homebrew cask to postflight_steps
        run: ruby ops/rewrite-cask-postflight.rb dist/homebrew/Casks/remiterm.rb

      - name: Publish Homebrew tap
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: sh ops/publish-homebrew-cask.sh
